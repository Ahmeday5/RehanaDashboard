<app-modal [open]="open()" title="إضافة مالك جديد" size="lg" (closed)="close()">
  <form class="add-member-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>

    <div class="upload-row">
      <label
        class="image-upload"
        [class.image-upload--filled]="!!imagePreviewUrl()"
        (dragover)="$event.preventDefault()"
        (drop)="onImageDrop($event)"
      >
        <input type="file" accept="image/*" (change)="onImageSelected($event)" hidden />
        @if (imagePreviewUrl(); as url) {
          <img class="image-upload-preview" [src]="url" alt="معاينة الصورة" />
        } @else {
          <app-icon name="users" [size]="22" />
        }
      </label>
      <div class="upload-copy">
        <span class="upload-title">الصورة الشخصية</span>
        <span class="upload-hint">اختياري — اسحب صورة هنا أو اضغط للاختيار</span>
        @if (selectedImage(); as file) {
          <button type="button" class="upload-remove" (click)="clearImage()">
            <app-icon name="x" [size]="12" />
            {{ file.name }}
          </button>
        }
      </div>
    </div>

    <div class="section-title">بيانات المالك</div>
    <div class="form-grid">
      <div class="field">
        <label class="field-label">الاسم</label>
        <input class="form-control" formControlName="name" placeholder="اسم المالك" />
        <app-form-error [control]="form.controls.name" label="الاسم" />
      </div>

      <div class="field">
        <label class="field-label">رقم الهاتف</label>
        <input class="form-control" formControlName="phoneNumber" placeholder="01xxxxxxxxx" />
        <app-form-error [control]="form.controls.phoneNumber" label="رقم الهاتف" />
      </div>

      <div class="field">
        <label class="field-label">البريد الإلكتروني</label>
        <input class="form-control" type="email" formControlName="email" placeholder="name@example.com" />
        <app-form-error [control]="form.controls.email" label="البريد الإلكتروني" />
      </div>

      <div class="field">
        <label class="field-label">كلمة السر</label>
        <app-password-input formControlName="password" autocomplete="new-password" />
        <app-form-error [control]="form.controls.password" label="كلمة السر" />
      </div>

      <div class="field">
        <label class="field-label">نوع الساكن</label>
        <select class="form-select" formControlName="memberType">
          @for (t of memberTypes; track t) {
            <option [value]="t">{{ t }}</option>
          }
        </select>
      </div>
    </div>

    <div class="section-title">بيانات الفيلا</div>
    <div class="form-grid">
      <div class="field">
        <label class="field-label">رقم الفيلا</label>
        <input class="form-control" formControlName="villaNumber" placeholder="رقم الفيلا" />
        <app-form-error [control]="form.controls.villaNumber" label="رقم الفيلا" />
      </div>

      <div class="field">
        <label class="field-label">عنوان الفيلا</label>
        <input class="form-control" formControlName="villaAddress" placeholder="عنوان الفيلا" />
        <app-form-error [control]="form.controls.villaAddress" label="عنوان الفيلا" />
      </div>

      <div class="field">
        <label class="field-label">موقع الفيلا</label>
        <input class="form-control" formControlName="villaLocation" placeholder="موقع الفيلا" />
        <app-form-error [control]="form.controls.villaLocation" label="موقع الفيلا" />
      </div>

      <div class="field">
        <label class="field-label">الشارع</label>
        <input class="form-control" formControlName="villaStreet" placeholder="اسم الشارع" />
      </div>

      <div class="field">
        <label class="field-label">المساحة (م²)</label>
        <input class="form-control" formControlName="villaSpace" placeholder="مثال: 250" />
        <app-form-error [control]="form.controls.villaSpace" label="المساحة" />
      </div>

      <div class="field">
        <label class="field-label">حالة التشطيب</label>
        <select class="form-select" formControlName="villaType">
          @for (t of villaTypes; track t) {
            <option [value]="t">{{ t }}</option>
          }
        </select>
      </div>
    </div>

    @if (serverError(); as msg) {
      <div class="server-error" role="alert">
        <app-icon name="bell" [size]="15" />
        <span>{{ msg }}</span>
      </div>
    }
  </form>

  <ng-container modal-footer>
    <app-button variant="secondary" (clicked)="close()">إلغاء</app-button>
    <app-button [loading]="isSubmitting()" (clicked)="onSubmit()">حفظ المالك</app-button>
  </ng-container>
</app-modal>
