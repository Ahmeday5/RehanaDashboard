<app-modal [open]="open()" title="تغيير كلمة السر" size="sm" (closed)="close()">
  <form class="pw-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    @if (target(); as member) {
      <p class="pw-target">
        <app-icon name="lock" [size]="14" />
        كلمة سر جديدة لـ <strong>{{ member.userName }}</strong>
      </p>
    }

    <div class="field">
      <label class="field-label">كلمة السر الجديدة</label>
      <app-password-input formControlName="newPassword" autocomplete="new-password" />
      <app-form-error [control]="form.controls.newPassword" label="كلمة السر" />
    </div>

    @if (serverError(); as msg) {
      <div class="server-error" role="alert">
        <app-icon name="bell" [size]="15" />
        <span>{{ msg }}</span>
      </div>
    }
  </form>

  <ng-container modal-footer>
    <app-button variant="secondary" (clicked)="close()">إلغاء</app-button>
    <app-button [loading]="isSubmitting()" (clicked)="onSubmit()">
      <app-icon name="lock" [size]="14" />
      تغيير كلمة السر
    </app-button>
  </ng-container>
</app-modal>
