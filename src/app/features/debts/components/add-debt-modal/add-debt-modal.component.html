<app-modal [open]="open()" title="إضافة مديونية" size="sm" (closed)="close()">
  <form class="debt-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <div class="field">
      <label class="field-label">الفيلا</label>
      <app-villa-select formControlName="villaNumber" placeholder="اختر فيلا..." />
      <app-form-error [control]="form.controls.villaNumber" label="الفيلا" />
    </div>

    <div class="field">
      <label class="field-label">المبلغ</label>
      <input class="form-control" formControlName="amount" placeholder="مثال: 500" inputmode="decimal" />
      <app-form-error [control]="form.controls.amount" label="المبلغ" />
    </div>

    <div class="field">
      <label class="field-label">ملاحظات</label>
      <input class="form-control" formControlName="notes" placeholder="مثال: مخالفة استخدام المرافق" />
      <app-form-error [control]="form.controls.notes" label="الملاحظات" />
    </div>

    @if (serverError(); as msg) {
      <div class="server-error" role="alert">
        <app-icon name="bell" [size]="15" />
        <span>{{ msg }}</span>
      </div>
    }
  </form>

  <ng-container modal-footer>
    <app-button variant="secondary" (clicked)="close()">إلغاء</app-button>
    <app-button [loading]="isSubmitting()" (clicked)="onSubmit()">
      <app-icon name="banknote" [size]="14" />
      إضافة المديونية
    </app-button>
  </ng-container>
</app-modal>
