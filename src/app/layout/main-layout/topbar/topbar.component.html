<header class="topbar">

  <!-- Mobile: hamburger to open sidebar drawer -->
  <button class="t-hamburger" (click)="layout.toggleMobile()" aria-label="القائمة">
    @if (layout.mobileOpen()) {
      <app-icon name="x" [size]="18" />
    } @else {
      <app-icon name="menu" [size]="18" />
    }
  </button>

  <div class="tright">
    <div class="t-user">
      <span class="t-avatar">{{ initials() }}</span>
      <span class="t-user-name">{{ currentUser()?.userName }}</span>
    </div>

    <button class="t-logout" (click)="logout()" title="تسجيل خروج" aria-label="تسجيل خروج">
      <app-icon name="log-out" [size]="16" />
    </button>
  </div>

</header>
